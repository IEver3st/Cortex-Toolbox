name = "cortex-cloud"
main = "src/index.ts"
# Latest date supported by workerd bundled with Wrangler 4.120.1 on 2026-08-11.
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

# This checked-in profile is deliberately safe for local development. Production
# values are written to an ignored deployment overlay by `pnpm prepare:deploy-config`.
[vars]
WORKOS_CLIENT_ID = ""
WORKOS_ISSUER = "https://api.workos.com/"
STRIPE_CREATOR_MONTHLY_PRICE_ID = ""
STRIPE_CREATOR_ANNUAL_PRICE_ID = ""
STRIPE_PRO_MONTHLY_PRICE_ID = ""
STRIPE_PRO_ANNUAL_PRICE_ID = ""
STRIPE_PORTAL_CONFIGURATION_ID = ""
BILLING_RETURN_URL = ""
CORTEX_AI_ENABLED = "false"
AI_PROVIDER_ENABLED = "false"
CORTEX_FREE_ONLY = "true"
STRIPE_RECONCILE_AFTER_SECONDS = "900"
CORTEX_ADMIN_WORKOS_USER_IDS = ""

[[d1_databases]]
binding = "DB"
database_name = "cortex-cloud-local"
migrations_dir = "migrations"

[observability]
enabled = true
head_sampling_rate = 1
