version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      electron-toolchain: { patterns: ['electron', '@electron-forge/*'] }
      testing: { patterns: ['vitest', '@testing-library/*', '@playwright/*', 'playwright'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
