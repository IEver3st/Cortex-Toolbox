name: Refresh nanoid lockfile

on:
  push:
    branches: [agent/fix-commercial-release-gates]

permissions:
  contents: write

concurrency:
  group: refresh-nanoid-lock
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/fix-commercial-release-gates
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - name: Update the security override and lockfile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.pnpm.overrides.nanoid = '3.3.18';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm install --lockfile-only --ignore-scripts
      - name: Remove this one-time workflow and commit the generated lockfile
        shell: bash
        run: |
          rm .github/workflows/refresh-nanoid-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml .github/workflows/refresh-nanoid-lock.yml
          git commit -m 'Update nanoid security override'
          git push origin HEAD:agent/fix-commercial-release-gates
