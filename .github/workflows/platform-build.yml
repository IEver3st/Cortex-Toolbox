name: Platform build matrix
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to package
        required: true
        default: stable
        type: choice
        options: [stable, beta]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CORTEX_RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons
      - name: Package installers
        run: |
          if [ "${CORTEX_RELEASE_CHANNEL}" = "beta" ]; then
            pnpm make:beta
          else
            pnpm make
          fi
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ env.CORTEX_RELEASE_CHANNEL }}-${{ runner.os }}-unsigned
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
