name: Apply Cortex hosted release fixes

on:
  push:
    branches: [agent/fix-cortex-hosted-auth-billing]

permissions:
  contents: write

concurrency:
  group: agent-fix-cortex-hosted-auth-billing
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: python scripts/agent-release-fix.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm security:scan
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: git diff --check
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "Cortex"
          git config user.email "141164617+IEver3st@users.noreply.github.com"
          git add -A
          git status --short
          HUSKY=0 git commit -m "Fix hosted authentication and billing release gates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
