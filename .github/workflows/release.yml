name: Release
run-name: Release v${{ inputs.version }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to release (without v)
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, beta]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      channel: ${{ steps.metadata.outputs.channel }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - name: Validate version, channel, changelog, and commit
        id: metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node scripts/release.ts --ci-metadata
      - name: Reject conflicting tags or published releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_SHA: ${{ steps.metadata.outputs.commit_sha }}
        run: |
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [[ -z "$remote_tag" ]]; then
            exit 0
          fi
          if [[ "$remote_tag" != "$RELEASE_SHA" ]]; then
            echo "Tag $RELEASE_TAG already points to another commit." >&2
            exit 1
          fi
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$draft" != "true" ]]; then
            echo "Release $RELEASE_TAG already exists and is not a retryable draft." >&2
            exit 1
          fi
          echo "Retrying the existing draft release for $RELEASE_TAG."

  build:
    name: Build and verify Windows artifacts
    needs: prepare
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - name: Verify hosted release coordinates
        env:
          CORTEX_WORKOS_CLIENT_ID: ${{ vars.CORTEX_WORKOS_CLIENT_ID }}
          CORTEX_CLOUD_API_URL: ${{ vars.CORTEX_CLOUD_API_URL }}
        run: node scripts/verify-hosted-release-coordinates.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:scan
      - run: pnpm audit --audit-level high
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            pnpm build
            $taskExitCode = $LASTEXITCODE
            if ($taskExitCode -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $taskExitCode }
            Write-Host "Build attempt $attempt failed; retrying the external Electron download."
            Start-Sleep -Seconds ($attempt * 5)
          }
      - run: pnpm test:e2e
      - name: Prepare Windows signing certificate
        id: signing
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.CORTEX_WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CORTEX_WINDOWS_CERTIFICATE_PASSWORD }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw 'Configure both Windows signing secrets or neither of them.'
          }
          if ($env:RELEASE_CHANNEL -eq 'stable' -and -not $hasCertificate) {
            throw 'Stable releases require the Windows signing certificate and password secrets.'
          }
          if (-not $hasCertificate) {
            'configured=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Output 'No signing certificate configured; producing an unsigned beta build.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'cortex-signing.p12'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "CORTEX_WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          'configured=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Package Windows release
        env:
          CORTEX_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          CORTEX_GITHUB_OWNER: ${{ github.repository_owner }}
          CORTEX_GITHUB_REPOSITORY: ${{ github.event.repository.name }}
          CORTEX_ENABLE_AUTO_UPDATE: 'true'
          CORTEX_WORKOS_CLIENT_ID: ${{ vars.CORTEX_WORKOS_CLIENT_ID }}
          CORTEX_CLOUD_API_URL: ${{ vars.CORTEX_CLOUD_API_URL }}
          CORTEX_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.CORTEX_WINDOWS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          if [[ "${{ needs.prepare.outputs.channel }}" == "beta" ]]; then
            pnpm make:beta
          else
            pnpm make
          fi
      - name: Verify signed package binaries
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          $targets = @(
            Get-ChildItem apps/desktop/out/make -Recurse -File -Filter '*Setup.exe' | Select-Object -First 1
            Get-ChildItem apps/desktop/out -Recurse -File -Filter 'cortex-toolbox*.exe' |
              Where-Object { $_.Directory.Name -like '*win32-x64' } |
              Select-Object -First 1
          )
          if ($targets.Count -ne 2 -or $targets -contains $null) { throw 'Signed package targets are missing.' }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
              throw "$($target.Name) signature is $($signature.Status), expected Valid."
            }
          }
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: apps/desktop/out/make
          format: cyclonedx-json
          output-file: apps/desktop/out/make/cortex-windows.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate deterministic checksums
        shell: pwsh
        run: |
          $root = (Resolve-Path apps/desktop/out/make).Path
          $checksum = Join-Path $root 'SHA256SUMS-Windows.txt'
          $assets = @(Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object FullName -ne $checksum)
          $duplicates = @($assets | Group-Object Name | Where-Object Count -gt 1)
          if ($duplicates.Count -gt 0) { throw "Duplicate release asset names: $($duplicates.Name -join ', ')" }
          $assets |
            Sort-Object Name |
            ForEach-Object { "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content -LiteralPath $checksum -Encoding utf8NoBOM
      - name: Verify release asset set and clean-runner installation
        shell: pwsh
        run: |
          $requireSignature = '${{ needs.prepare.outputs.channel }}' -eq 'stable'
          ./scripts/verify-release-assets.ps1 `
            -ArtifactsDirectory apps/desktop/out/make `
            -Channel '${{ needs.prepare.outputs.channel }}' `
            -RequireSignature:$requireSignature `
            -InstallSmoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.prepare.outputs.channel }}-windows
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create and scan draft release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    outputs:
      release_url: ${{ steps.release.outputs.url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: release-artifacts, merge-multiple: true }
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan generated release artifacts
        run: |
          gitleaks dir release-artifacts --max-archive-depth 3 --redact=100 --no-banner
          if find release-artifacts -type f -name '*.map' -print -quit | grep -q .; then
            echo 'Production source maps must not be published.' >&2
            exit 1
          fi
      - name: Create or update private draft
        id: release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit_sha }}
          files: release-artifacts/**/*
          generate_release_notes: true
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          body: |
            Release channel: `${{ needs.prepare.outputs.channel }}`.
            Windows 10/11 installer build from `${{ needs.prepare.outputs.commit_sha }}`.

            The release is created as a private draft, then checksums, signatures, installation,
            launch, uninstall, and the GitHub-hosted asset set are verified before publication.
            Stable releases cannot pass without valid Authenticode signing.

  verify-draft:
    name: Verify GitHub-hosted draft assets
    needs: [prepare, draft]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: Download draft release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Path release-download | Out-Null
          gh release download $env:RELEASE_TAG --dir release-download
          $release = gh release view $env:RELEASE_TAG --json isDraft,tagName,targetCommitish | ConvertFrom-Json
          if (-not $release.isDraft) { throw 'Release must remain a draft until verification completes.' }
          if ($release.tagName -ne $env:RELEASE_TAG) { throw 'Downloaded release tag does not match the request.' }
      - name: Verify published checksums, signatures, install, launch, and uninstall
        shell: pwsh
        run: |
          $requireSignature = '${{ needs.prepare.outputs.channel }}' -eq 'stable'
          ./scripts/verify-release-assets.ps1 `
            -ArtifactsDirectory release-download `
            -Channel '${{ needs.prepare.outputs.channel }}' `
            -RequireSignature:$requireSignature `
            -InstallSmoke

  publish:
    name: Publish verified release
    needs: [prepare, draft, verify-draft]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          fi
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets
      - name: Record release result
        run: |
          echo "### Published ${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ needs.draft.outputs.release_url }}" >> "$GITHUB_STEP_SUMMARY"

  cleanup-failed-draft:
    name: Remove failed draft release
    if: ${{ always() && needs.draft.result == 'success' && needs.publish.result != 'success' }}
    needs: [prepare, draft, verify-draft, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Delete the unpublished draft and generated tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$draft" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          fi
