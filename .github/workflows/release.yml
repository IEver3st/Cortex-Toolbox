name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:scan
      - run: pnpm audit --audit-level high
      - run: pnpm test && pnpm typecheck && pnpm lint
      - name: Detect release channel from tag
        id: channel
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"beta"* ]]; then
            echo "name=beta" >> "$GITHUB_OUTPUT"
          else
            echo "name=stable" >> "$GITHUB_OUTPUT"
          fi
      - name: Build icons
        run: pnpm icons
      - name: Prepare optional Windows signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.CORTEX_WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            Write-Output 'No signing certificate configured; producing an unsigned build.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'cortex-signing.p12'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "CORTEX_WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Package Windows installer
        env:
          CORTEX_RELEASE_CHANNEL: ${{ steps.channel.outputs.name }}
          CORTEX_GITHUB_OWNER: ${{ github.repository_owner }}
          CORTEX_GITHUB_REPOSITORY: ${{ github.event.repository.name }}
          CORTEX_ENABLE_AUTO_UPDATE: 'true'
          CORTEX_WORKOS_CLIENT_ID: ${{ vars.CORTEX_WORKOS_CLIENT_ID }}
          CORTEX_CLOUD_API_URL: ${{ vars.CORTEX_CLOUD_API_URL }}
          CORTEX_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.CORTEX_WINDOWS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          if [ "${{ steps.channel.outputs.name }}" = "beta" ]; then
            pnpm make:beta
          else
            pnpm make
          fi
      - uses: anchore/sbom-action@v0
        with:
          path: apps/desktop/out/make
          format: cyclonedx-json
          output-file: apps/desktop/out/make/cortex-windows.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        shell: pwsh
        run: Get-ChildItem apps/desktop/out/make -File -Recurse | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path.Replace((Resolve-Path .).Path + '\', ''))" } | Set-Content apps/desktop/out/make/SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.channel.outputs.name }}-windows
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-artifacts, merge-multiple: true }
      - name: Detect prerelease
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-beta"* ]] || [[ "${GITHUB_REF_NAME}" == *"beta"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body: |
            Release channel: `${{ steps.meta.outputs.channel }}`.
            Windows 10/11 installer build.
            Platform signing is applied only when repository signing credentials are configured.
            Artifacts without a platform signature are clearly considered unsigned development builds.
